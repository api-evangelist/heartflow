    status: 000
    note: does not resolve
  - url: https://status.heartflow.net/
    status: 000
    note: does not resolve
  - url: https://heartflow.statuspage.io/
    status: 200
    note: >-
      NOT a Heartflow status page. Atlassian serves its Statuspage marketing site for
