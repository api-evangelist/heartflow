note: >-
  Heartflow publishes no versioning policy, no deprecation policy, no SLA and no status
  page. Only the versioning SCHEME could be established, and only from an observed route.
  NO `StatusPage` and NO `Deprecation` pointer is emitted in apis.yml.
versioning:
  scheme: uri-path
  current_version: v1
  evidence: >-
    https://api.heartflow.net/api/v1/ returns the DRF authentication challenge (403)
    while https://api.heartflow.net/api/ returns 404, so /api/v1/ is a real mounted
    version prefix.
  policy_published: false
deprecation:
  policy_published: false
  sunset_header: unknown
  deprecation_header: unknown
  note: >-
    RFC 8594 Sunset / Deprecation headers could not be observed — no route returns a
    2xx anonymously.
  deprecated_operations: []
status_page:
  published: false
  probes:
