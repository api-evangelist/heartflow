aid: heartflow
name: HeartFlow
description: 'Heartflow, Inc. (Nasdaq: HTFL) is a healthcare technology company founded in 2010 and headquartered
  in San Francisco, California. Its Heartflow One platform applies AI to coronary computed tomography
  angiography (CCTA) to non-invasively diagnose and manage coronary artery disease, bundling Roadmap Analysis,
  FFRct Analysis, Plaque Analysis, Plaque Staging and the PCI Navigator, and delivering results back into
  hospital PACS and EMR systems. More than 650,000 patients have been analyzed across 1,800+ institutions.
  Heartflow runs a production REST API at api.heartflow.net and customer documentation at docs.heartflow.net,
  but both are authenticated: there is no public developer program, no published OpenAPI, and no self-serve
  signup.'
